<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/addons/p5.sound.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
  </head>
  <body>
    <main>
    </main>

    <div id="hud">
      <div class="hudGroup" id="sliders">
        <div class="sliderGroup">
          <span>Count (each)</span>
          <input id="countSlider" type="range" min="5" max="60" value="30" />
          <span class="sliderValue" id="countValue">30</span>
        </div>

        <div class="sliderGroup">
          <span>Speed</span>
          <input id="speedSlider" type="range" min="0" max="3" step="0.1" value="1" />
          <span class="sliderValue" id="speedValue">1×</span>
        </div>
      </div>

      <div class="hudGroup">
        <button id="restartButton">Restart</button>
        <button id="gifButton">Download GIF</button>
      </div>
    </div>

    <script src="sketch.js"></script>
    <script src="tool.js"></script>
  </body>
</html>
